name: Juan9
version: '${version}'
main: com.ika.juan9.Juan9
api-version: '1.21'
load: POSTWORLD

commands:
  setregion:
    description: 보호 구역의 모서리를 설정합니다.
    usage: /setregion <1 또는 2>
  spawnshop:
    description: 상점 NPC를 소환합니다.
    usage: /spawnshop <상점이름>
  addtrade:
    description: 손에 든 아이템으로 거래를 등록합니다.
    usage: /addtrade <상점이름>
  clearshop:
    description: 상점의 거래 품목을 초기화합니다.
    usage: /clearshop <상점이름>
  money:
    description: 잔액을 확인하거나 관리자가 계좌 목록 조회 및 돈을 지급합니다.
    usage: /money [목록/지급]
  check:
    description: 수표 아이템을 발급합니다.
    usage: /check <금액>
  cash:
    description: 위조 불가능한 공식 현금을 발급합니다.
    usage: /cash <금액> [개수]
  spawnbank:
    description: 은행원 NPC를 소환합니다.
    usage: /spawnbank
  stat:
    description: 스텟 분배 GUI를 열거나 관리자가 스텟을 확인/지급/회수/초기화합니다.
    usage: /stat [목록/지급/회수/초기화]
  spawnblacksmith:
    description: 대장장이 NPC를 소환합니다.
    usage: /spawnblacksmith
  upgrade:
    description: 손에 든 아이템의 강화 수치를 강제로 설정합니다.
    usage: /upgrade <강화수치>
  rpgitem:
    description: 전직 전용 특수 아이템을 발급합니다.
    usage: /rpgitem <도약/화살통> [플레이어]
  killnpc:
    description: 가장 가까운 NPC를 즉시 제거합니다.
    usage: /killnpc
  invsee:
    description: 대상 플레이어의 인벤토리를 실시간으로 확인하고 수정합니다.
    usage: /invsee <플레이어이름>
  setcenter:
    description: 현재 위치를 귀환 주문서의 중앙 이동 지점으로 설정합니다.
    usage: /setcenter
  deltrade:
    description: 지정한 상점의 특정 번호 거래 항목을 개별 삭제합니다.
    usage: /deltrade <상점이름> <번호>
  shopedit:
    description: 주민 상점 품목 편집 GUI를 엽니다.
    permission: op
  mobdamage:
    description: 적대적 몬스터의 피해 배율을 확인하거나 변경합니다.
    usage: /mobdamage [배율]
